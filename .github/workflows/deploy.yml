name: Deploy to GitHub Pages

# ⚠️ Прод — это Render (https://pokematrix.onrender.com), а НЕ GitHub Pages.
# Клиент обращается к API по АБСОЛЮТНОМУ same-origin пути '/api' (см.
# src/game/config.ts), поэтому статическая копия на Pages принципиально не
# рабочая: у неё нет бэкенда, /api/* там отдаёт 404. Плюс Pages для репозитория
# не включён, из-за чего deploy-pages@v4 падал на КАЖДОМ пуше в main и красил
# историю коммитов в красный независимо от состояния кода.
#
# Поэтому workflow оставлен только для ручного запуска (например, чтобы
# посмотреть собранный бандл или отдать статику на отдельный хост вместе с API).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - run: npm install --include=optional
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
