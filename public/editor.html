<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokeMatrix — правка данных</title>
<style>
  :root {
    --bg:#0d1220; --card:#161f33; --card2:#1e2a44; --border:#2c3c60;
    --text:#e9eefc; --muted:#8fa0c2; --accent:#4a9eff; --green:#2fb457; --red:#ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); padding:14px;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 8px; color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:8px 16px; border:1px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--muted); cursor:pointer; font-weight:600; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:12px; margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:9px 0 3px; }
  input,select,textarea { width:100%; font:inherit; color:var(--text); background:var(--card2);
    border:1px solid var(--border); border-radius:7px; padding:7px 9px; }
  textarea { resize:vertical; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  .hint { font-size:12px; color:var(--muted); margin-top:3px; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { font:inherit; cursor:pointer; padding:8px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--card2); color:var(--text); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:var(--green); border-color:var(--green); color:#05230f; font-weight:700; }
  button.danger { color:var(--red); border-color:var(--red); background:transparent; }
  .split { display:grid; grid-template-columns:290px 1fr; gap:12px; align-items:start; }
  @media (max-width:860px){ .split{ grid-template-columns:1fr; } }
  .list { max-height:70vh; overflow:auto; }
  .item { padding:6px 9px; border-radius:7px; cursor:pointer; }
  .item:hover { background:var(--card2); }
  .item.sel { background:var(--accent); color:#fff; }
  .item .meta { font-size:11px; opacity:.7; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .hide { display:none !important; }
  .tag { display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--border);
    border-radius:20px; padding:1px 8px; margin-right:4px; }
  .chg { color:var(--orange,#ff9500); }
  #out { min-height:190px; white-space:pre; font-size:12.5px;
    font-family:ui-monospace,Consolas,monospace; }
  .ok { color:var(--green); font-weight:700; }
</style>
</head>
<body>

<h1>📝 PokeMatrix — правка данных</h1>
<div class="sub">
  Слева — что <b>сейчас в игре</b>. Правь как есть, я применю. Данные сохраняются
  <b>в этом же файле</b>: «💾 Сохранить в файл» → пришлёшь мне этот html.
</div>

<div class="tabs">
  <button class="tab active" data-tab="loc">🗺 Локации</button>
  <button class="tab" data-tab="shop">🏪 Магазины</button>
  <button class="tab" data-tab="price">💰 Цены</button>
</div>

<!-- ═════════ ЛОКАЦИИ ═════════ -->
<div id="tab-loc">
  <div class="split">
    <div class="card">
      <input type="text" id="locSearch" placeholder="Поиск локации…">
      <select id="locRegion" style="margin-top:6px"><option value="">Все регионы</option></select>
      <div class="list" id="locList" style="margin-top:8px"></div>
    </div>
    <div class="card" id="locPane">
      <div class="hint">Выбери локацию слева.</div>
    </div>
  </div>
</div>

<!-- ═════════ МАГАЗИНЫ ═════════ -->
<div id="tab-shop">
  <div class="split">
    <div class="card">
      <input type="text" id="shopSearch" placeholder="Поиск магазина…">
      <div class="list" id="shopList" style="margin-top:8px"></div>
    </div>
    <div class="card" id="shopPane">
      <div class="hint">Выбери магазин слева.</div>
    </div>
  </div>
</div>

<!-- ═════════ ЦЕНЫ ═════════ -->
<div id="tab-price">
  <div class="card">
    <input type="text" id="priceSearch" placeholder="Поиск предмета…">
    <div class="list" id="priceList" style="margin-top:8px"></div>
  </div>
</div>

<!-- ═════════ ИТОГ ═════════ -->
<div class="card">
  <h2>Что изменилось <span class="tag" id="chgCount">0</span></h2>
  <div id="changes"></div>
  <div class="bar">
    <button class="danger" id="btnRevert">↺ Вернуть всё как было</button>
  </div>
  <label style="margin-top:12px">Готовый текст (он же внутри файла, в блоке pokematrix-data)</label>
  <textarea id="out" readonly></textarea>
  <div class="bar">
    <button class="ok" id="btnCopy">📋 Скопировать текст</button>
    <button class="ok" id="btnSave">💾 Сохранить в файл (html)</button>
  </div>
</div>

/* ═══ РАБОЧАЯ КОПИЯ (то, что ты правишь) ═══ */
const DATA = JSON.parse(JSON.stringify(BASELINE));
/* ═══ СПИСОК ИЗМЕНЕНИЙ (что отличается от исходного) ═══ */
let CHANGES = {};

const $ = (s) => document.querySelector(s);
const L = (s) => (s || '').split('\n').map(x => x.trim()).filter(Boolean);
const mk = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };

/* ══════════════ ЛОКАЦИИ ══════════════ */
let curLoc = null;

function locList() {
  const q = $('#locSearch').value.trim().toLowerCase();
  const reg = $('#locRegion').value;
  const box = $('#locList'); box.innerHTML = '';
  let n = 0;
  for (const l of DATA.locations) {
    if (reg && l.region !== reg) continue;
    if (q && !(l.id.toLowerCase().includes(q) || (l.name||'').toLowerCase().includes(q))) continue;
    const it = mk('div', 'item' + (curLoc === l.id ? ' sel' : ''));
    it.appendChild(mk('div', null, l.name || l.id));
    const meta = [l.id, l.region, 'видов: ' + l.encounters.length];
    if (l.dayEncounters.length) meta.push('днём: ' + l.dayEncounters.length);
    if (l.nightEncounters.length) meta.push('ночью: ' + l.nightEncounters.length);
    it.appendChild(mk('div', 'meta', meta.join(' · ')));
    it.onclick = () => { curLoc = l.id; locList(); locPane(); };
    box.appendChild(it); n++;
  }
  if (!n) box.appendChild(mk('div', 'hint', 'не найдено'));
}

function locPane() {
  const pane = $('#locPane'); pane.innerHTML = '';
  if (!curLoc) { pane.appendChild(mk('div', 'hint', 'Выбери локацию слева.')); return; }
  const l = DATA.locations.find(x => x.id === curLoc);
  const base = BASELINE.locations.find(x => x.id === curLoc);

  pane.appendChild(mk('h2', null, l.name + '  (' + l.id + ')'));
  const tags = mk('div', 'row');
  tags.appendChild(mk('span', 'tag', l.region));
  if (l.wildMinLvl != null) tags.appendChild(mk('span', 'tag', 'lv ' + l.wildMinLvl + '–' + l.wildMaxLvl));
  if (l.mechanic) tags.appendChild(mk('span', 'tag', l.mechanic));
  if (l.noCatch) tags.appendChild(mk('span', 'tag', 'не ловится'));
  if (l.requiresBadges != null) tags.appendChild(mk('span', 'tag', 'значков: ' + l.requiresBadges));
  pane.appendChild(tags);

  const field = (title, value, hint) => {
    const w = mk('div');
    w.appendChild(mk('label', null, title));
    const ta = mk('textarea'); ta.rows = 5; ta.value = value;
    ta.oninput = () => { l[key] = L(ta.value); mark(); locList(); };
    w.appendChild(ta);
    if (hint) w.appendChild(mk('div', 'hint', hint));
    pane.appendChild(w);
    return ta;
  };
  let key = 'encounters';
  field('Энкаунтеры (общий список) — по одному виду на строку', l.encounters.join('\n'),
    'Это виды, которые тут водятся ВСЕГДА. Порядок = вероятность (первый самый частый).');
  key = 'dayEncounters';
  field('Днём нападают', l.dayEncounters.join('\n'), 'Пусто = днём водятся общие.');
  key = 'nightEncounters';
  field('Ночью нападают', l.nightEncounters.join('\n'), 'Пусто = ночью водятся общие.');

  // уровни
  const lv = mk('div', 'row');
  const minI = mk('input'); minI.type = 'number'; minI.value = l.wildMinLvl ?? '';
  const maxI = mk('input'); maxI.type = 'number'; maxI.value = l.wildMaxLvl ?? '';
  const a1 = mk('div'); a1.appendChild(mk('label', null, 'Уровень: мин')); a1.appendChild(minI);
  const a2 = mk('div'); a2.appendChild(mk('label', null, 'Уровень: макс')); a2.appendChild(maxI);
  lv.appendChild(a1); lv.appendChild(a2);
  minI.oninput = () => { l.wildMinLvl = minI.value === '' ? null : +minI.value; mark(); };
  maxI.oninput = () => { l.wildMaxLvl = maxI.value === '' ? null : +maxI.value; mark(); };
  pane.appendChild(lv);

  // дропы видов этой локации
  const dw = mk('div');
  dw.appendChild(mk('label', null, 'Дропы видов этой локации (вид → предмет:шанс:кол-во)'));
  const species = [...new Set([...l.encounters, ...l.dayEncounters, ...l.nightEncounters])];
  const dta = mk('textarea'); dta.rows = Math.min(14, species.length + 1);
  dta.value = species.map(s => {
    const d = DATA.drops[s] || [];
    return d.length ? s + ': ' + d.map(x => x.item + ':' + x.chance + ':' + x.qty).join(', ') : '';
  }).filter(Boolean).join('\n');
  dw.appendChild(dta);
  dw.appendChild(mk('div', 'hint', 'Формат: вид:предмет:шанс:кол-во. Шанс — доля (0.05 = 5%). Пустая строка = у вида нет дропа.'));
  dw.appendChild(mk('div', 'hint', 'Пример: pidgey:sharpBeak:0.05:1'));
  dta.oninput = () => {
    for (const line of L(dta.value)) {
      const [sp, ...rest] = line.split(':');
      const key = sp.trim();
      if (!key) continue;
      if (!rest.length) { delete DATA.drops[key]; continue; }
      const arr = rest.map(r => {
        const [item, chance, qty] = r.split(':');
        return { item: (item||'').trim(), chance: +(chance||0), qty: +(qty||1) };
      });
      DATA.drops[key] = arr;
    }
    mark();
  };
  pane.appendChild(dw);

  const note = mk('textarea'); note.rows = 2; note.placeholder = 'Заметка словами: что именно нужно';
  note.oninput = () => { CHANGES.notes = CHANGES.notes || {}; CHANGES.notes[curLoc] = note.value; mark(); };
  pane.appendChild(mk('label', null, 'Заметка'));
  pane.appendChild(note);

  if (base && JSON.stringify(base) !== JSON.stringify(l)) {
    const t = mk('div', 'tag chg', 'изменено');
    pane.appendChild(t);
  }
}

/* ══════════════ МАГАЗИНЫ ══════════════ */
let curShop = null;

function shopList() {
  const q = $('#shopSearch').value.trim().toLowerCase();
  const box = $('#shopList'); box.innerHTML = '';
  for (const [mart, s] of Object.entries(DATA.shops)) {
    if (q && !mart.toLowerCase().includes(q)) continue;
    const it = mk('div', 'item' + (curShop === mart ? ' sel' : ''));
    it.appendChild(mk('div', null, mart));
    it.appendChild(mk('div', 'meta', 'тир ' + s.tier + ' · позиций ' + s.items.length));
    it.onclick = () => { curShop = mart; shopList(); shopPane(); };
    box.appendChild(it);
  }
}

function shopPane() {
  const pane = $('#shopPane'); pane.innerHTML = '';
  if (!curShop) { pane.appendChild(mk('div', 'hint', 'Выбери магазин слева.')); return; }
  const s = DATA.shops[curShop];
  const base = BASELINE.shops[curShop];
  pane.appendChild(mk('h2', null, curShop + '  (тир ' + s.tier + ')'));

  const add = mk('input'); add.placeholder = 'id предмета для добавления…';
  const addBtn = mk('button', 'primary', '+ Добавить');
  addBtn.onclick = () => {
    const v = add.value.trim();
    if (!v) return;
    if (!s.items.includes(v)) s.items.push(v);
    add.value = ''; mark(); shopList(); shopPane();
  };
  const bar1 = mk('div', 'row');
  bar1.appendChild(add); bar1.appendChild(addBtn);
  pane.appendChild(mk('label', null, 'Добавить предмет в продажу'));
  pane.appendChild(bar1);

  const list = mk('div', 'list'); list.style.marginTop = '10px';
  for (const id of s.items) {
    const def = DATA.items[id];
    const row = mk('div', 'item');
    row.style.cursor = 'default';
    const nm = mk('div', null, (def ? def.name : id));
    nm.style.flex = '1';
    row.appendChild(nm);
    const price = mk('input'); price.type = 'number'; price.style.width = '95px';
    price.value = DATA.serverPrices[id] ?? def?.price ?? '';
    price.onchange = () => {
      DATA.serverPrices[id] = +price.value || 0;
      if (DATA.items[id]) DATA.items[id].price = +price.value || 0;
      mark();
    };
    row.appendChild(price);
    const del = mk('button', 'danger', '✕');
    del.style.padding = '2px 8px';
    del.onclick = () => {
      s.items = s.items.filter(x => x !== id);
      mark(); shopList(); shopPane();
    };
    row.appendChild(del);
    list.appendChild(row);
  }
  pane.appendChild(list);

  if (base && JSON.stringify(base.items) !== JSON.stringify(s.items)) {
    pane.appendChild(mk('div', 'tag chg', 'состав изменён'));
  }
}

/* ══════════════ ЦЕНЫ ══════════════ */
function priceList() {
  const q = $('#priceSearch').value.trim().toLowerCase();
  const box = $('#priceList'); box.innerHTML = '';
  for (const [id, it] of Object.entries(DATA.items)) {
    if (q && !id.toLowerCase().includes(q) && !(it.name||'').toLowerCase().includes(q)) continue;
    const row = mk('div', 'item');
    row.style.cursor = 'default';
    const nm = mk('div', null, it.name + '  ' + id);
    nm.style.flex = '1';
    row.appendChild(nm);
    const p = mk('input'); p.type = 'number'; p.style.width = '95px';
    p.value = it.price;
    p.onchange = () => { it.price = +p.value || 0; mark(); };
    row.appendChild(p);
    const s = mk('input'); s.type = 'number'; s.style.width = '95px';
    s.value = DATA.serverPrices[id] ?? it.price;
    s.title = 'цена на сервере';
    s.onchange = () => { DATA.serverPrices[id] = +s.value || 0; mark(); };
    row.appendChild(s);
    box.appendChild(row);
  }
}

/* ══════════════ ИЗМЕНЕНИЯ ══════════════ */
function mark() {
  CHANGES = {};
  for (const l of DATA.locations) {
    const b = BASELINE.locations.find(x => x.id === l.id);
    if (!b) continue;
    const diff = {};
    for (const k of ['encounters','dayEncounters','nightEncounters','wildMinLvl','wildMaxLvl']) {
      if (JSON.stringify(l[k]) !== JSON.stringify(b[k])) diff[k] = l[k];
    }
    if (Object.keys(diff).length) CHANGES.locations = CHANGES.locations || {}, CHANGES.locations[l.id] = diff;
  }
  for (const [sp, d] of Object.entries(DATA.drops)) {
    const b = BASELINE.drops[sp];
    if (JSON.stringify(d) !== JSON.stringify(b)) CHANGES.drops = CHANGES.drops || {}, CHANGES.drops[sp] = d;
  }
  for (const [sp] of Object.entries(BASELINE.drops)) {
    if (!DATA.drops[sp]) CHANGES.drops = CHANGES.drops || {}, CHANGES.drops[sp] = null;
  }
  for (const [mart, s] of Object.entries(DATA.shops)) {
    const b = BASELINE.shops[mart];
    if (JSON.stringify(s.items) !== JSON.stringify(b.items)) {
      CHANGES.shops = CHANGES.shops || {}, CHANGES.shops[mart] = { items: s.items };
    }
  }
  for (const [id, p] of Object.entries(DATA.serverPrices)) {
    if (p !== BASELINE.serverPrices[id]) {
      CHANGES.prices = CHANGES.prices || {}, CHANGES.prices[id] = p;
    }
  }
  if (CHANGES.notes) CHANGES.notes = CHANGES.notes;
  renderChanges();
}

function renderChanges() {
  const box = $('#changes'); box.innerHTML = '';
  const n = Object.keys(CHANGES.locations || {}).length
    + Object.keys(CHANGES.drops || {}).length
    + Object.keys(CHANGES.shops || {}).length
    + Object.keys(CHANGES.prices || {}).length;
  $('#chgCount').textContent = n;
  if (!n) { box.appendChild(mk('div', 'hint', 'Пока ничего не изменено — правишь слева, здесь появится список.')); }
  for (const [id, d] of Object.entries(CHANGES.locations || {})) {
    box.appendChild(mk('div', 'hint', '• ' + id + ': ' + Object.keys(d).join(', ')));
  }
  for (const [sp] of Object.entries(CHANGES.drops || {})) box.appendChild(mk('div', 'hint', '• дропы: ' + sp));
  for (const [mart] of Object.entries(CHANGES.shops || {})) box.appendChild(mk('div', 'hint', '• магазин: ' + mart));
  for (const [id] of Object.entries(CHANGES.prices || {})) box.appendChild(mk('div', 'hint', '• цена: ' + id));

  const payload = {
    format: 'pokematrix-editor/v2',
    updatedAt: new Date().toISOString(),
    changes: CHANGES,
  };
  $('#out').value = JSON.stringify(payload, null, 1);
  document.querySelector('#pokematrix-data').textContent = JSON.stringify(payload, null, 1);
}

/* ══════════════ ВКЛАДКИ ══════════════ */
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
    for (const t of ['loc','shop','price']) $('#tab-' + t).classList.toggle('hide', t !== b.dataset.tab);
  };
});

$('#btnCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#out').value); alert('Скопировано'); }
  catch { $('#out').focus(); $('#out').select(); alert('Выделил — Ctrl+C'); }
};

$('#btnSave').onclick = () => {
  mark();
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pokematrix-dannye.html';
  a.click();
  URL.revokeObjectURL(a.href);
  alert('Файл скачан — пришли его мне, я возьму правки из него.');
};

$('#btnRevert').onclick = () => {
  if (!confirm('Вернуть все данные как было в игре?')) return;
  const fresh = JSON.parse(JSON.stringify(BASELINE));
  DATA.locations = fresh.locations;
  DATA.drops = fresh.drops;
  DATA.shops = fresh.shops;
  DATA.items = fresh.items;
  DATA.serverPrices = fresh.serverPrices;
  mark(); locList(); shopList(); priceList();
};

$('#locSearch').oninput = locList;
$('#locRegion').onchange = locList;
$('#shopSearch').oninput = shopList;
$('#priceSearch').oninput = priceList;

/* ══════════════ СТАРТ ══════════════ */
for (const r of [...new Set(BASELINE.locations.map(l => l.region))]) {
  const o = mk('option', null, r); o.value = r; $('#locRegion').appendChild(o);
}
locList(); shopList(); priceList(); mark();
</script>
